name: Tests

on:
  push:
    paths: ['engine/**', 'collector/**', 'config/**', 'web/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['engine/**', 'collector/**', 'config/**', 'web/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: collector
      - run: npm run typecheck
        working-directory: collector
      - run: npm test
        working-directory: collector
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
