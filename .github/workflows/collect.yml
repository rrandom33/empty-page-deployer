name: Recolector

on:
  schedule:
    # Minutos impares: GitHub retrasa o descarta más los cron en punto y a las medias.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar la rama data
        run: |
          collector/scripts/data-branch.sh pull \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch

      - name: Recoger
        id: collect
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          DATA_DIR: data-branch
        run: node collector/src/main.ts

      - name: Guardar en la rama data
        if: steps.collect.outputs.changed == 'true'
        run: collector/scripts/data-branch.sh push data-branch

      - name: Publicar la web
        if: steps.collect.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"

      - name: Abrir un issue tras tres fallos seguidos
        if: failure()
        run: |
          failed=$(gh run list --workflow collect.yml --status completed --limit 2 \
            --json conclusion --jq '[.[] | select(.conclusion == "failure")] | length')
          open=$(gh issue list --state open --search 'in:title "El recolector falla"' --json number --jq length)
          if [ "$failed" = "2" ] && [ "$open" = "0" ]; then
            gh issue create --title 'El recolector falla' \
              --body "Tres ejecuciones seguidas del recolector han fallado. Última: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
